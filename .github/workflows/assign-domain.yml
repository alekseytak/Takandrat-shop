name: Боевой домен на свежий деплой

# Зачем это нужно.
# Домен takandrat-shop.vercel.app сам за новыми деплоями не следует: в списке
# automaticAliases у свежего деплоя его нет, а ручная привязка остаётся на том
# деплое, которому её выдали. Из-за этого боевой адрес молча отдавал старую
# сборку (в ней даже не было маршрутов /api/* — POST отвечал 405).
# Поэтому после каждого пуша в main домен назначается собранному деплою заново.
#
# Секрет VERCEL_TOKEN — токен Vercel формата vcp_… (Settings → Tokens).
# Секретного в самом файле нет: id команды и проекта видны в адресах Vercel.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: assign-domain
  cancel-in-progress: false

jobs:
  alias:
    runs-on: ubuntu-latest
    steps:
      - name: Повесить домен на деплой этого коммита
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          TEAM_ID: team_1Z0A2w08eqiCtHT8ewo2ziqu
          PROJECT_ID: prj_1U7k1ExLSuyX7QJKu4ET3ftcm5pp
          DOMAIN: takandrat-shop.vercel.app
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "Нет секрета VERCEL_TOKEN — назначить домен нечем." >&2
            exit 1
          fi

          LIST_URL="https://api.vercel.com/v6/deployments?projectId=$PROJECT_ID&teamId=$TEAM_ID&limit=20"
          FILTER='.deployments[] | select((.meta.githubCommitSha // "") == $sha and .target == "production")'

          uid=""
          for i in $(seq 1 40); do
            resp=$(curl -sS --max-time 30 -H "Authorization: Bearer $VERCEL_TOKEN" "$LIST_URL")
            uid=$(echo "$resp" | jq -r --arg sha "$SHA" "$FILTER | .uid" | head -1)
            state=$(echo "$resp" | jq -r --arg sha "$SHA" "$FILTER | (.state // .readyState)" | head -1)
            echo "[$i] деплой=$uid состояние=$state"
            if [ "$state" = "READY" ]; then break; fi
            if [ "$state" = "ERROR" ] || [ "$state" = "CANCELED" ]; then
              echo "Деплой этого коммита не собрался: $state" >&2
              exit 1
            fi
            uid=""
            sleep 15
          done

          if [ -z "$uid" ] || [ "$uid" = "null" ]; then
            echo "Деплой коммита $SHA не найден за отведённое время." >&2
            exit 1
          fi

          out=$(curl -sS --max-time 30 -X POST \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H 'Content-Type: application/json' \
            -d "{\"alias\":\"$DOMAIN\"}" \
            "https://api.vercel.com/v2/deployments/$uid/aliases?teamId=$TEAM_ID")
          echo "ответ Vercel: $out"

          if ! echo "$out" | jq -e --arg d "$DOMAIN" '.alias == $d' > /dev/null; then
            echo "Домен не назначен. Ответ Vercel выше." >&2
            exit 1
          fi

          echo "Готово: $DOMAIN указывает на деплой $uid"
